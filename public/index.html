<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resort Map — Cabana Booking</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <img class="resort-background" src="/static/resort-cabanas.jpg" alt="" aria-hidden="true">
  <div class="top-page-gradient" aria-hidden="true"></div>
  <main id="map-section" class="map-section container-fluid px-3 px-lg-5">
    <div class="section-intro row align-items-end g-4">
      <div class="col-lg-7">
        <div class="title-group d-flex align-items-end">
          <img class="site-logo" src="/static/logo.png" alt="Resort Map logo">
          <div>
            <p class="eyebrow">01 / TEST PROJECT</p>
            <h1>Resort map</h1>
          </div>
        </div>
      </div>
      <div class="col-lg-5 text-lg-end">
        <p id="availability" class="availability" aria-live="polite">Loading map…</p>
        <p class="section-caption">Tap a cabana to check availability and book in one step.</p>
      </div>
    </div>

    <div id="message" class="alert d-flex align-items-center gap-2" role="status" aria-live="polite" hidden></div>
    <div class="map-frame">
      <div class="map-scroll">
        <div id="map" class="map" aria-label="Interactive resort map"></div>
      </div>
    </div>

    <div id="legend" class="legend row g-3" aria-label="Map legend">
      <div class="col-6 col-md-auto"><span><i class="legend-icon cabana-icon"></i> Available</span></div>
      <div class="col-6 col-md-auto"><span><i class="legend-icon booked-icon"></i> Booked</span></div>
      <div class="col-6 col-md-auto"><span><i class="legend-icon pool-icon"></i> Pool</span></div>
      <div class="col-6 col-md-auto"><span><i class="legend-icon path-icon"></i> Path</span></div>
      <div class="col-6 col-md-auto"><span><i class="legend-icon chalet-icon"></i> Chalet</span></div>
    </div>
  </main>

  <section id="mobileCabanaSheet" class="mobile-cabana-sheet" aria-label="Selected cabana" hidden>
    <div class="mobile-sheet-handle" aria-hidden="true"></div>
    <div class="mobile-cabana-heading">
      <h2 id="mobileSelectedCabana">Cabana</h2>
      <span class="mobile-availability-badge">Available</span>
    </div>
    <div class="mobile-cabana-details">
      <span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20v-9h16v9M7 11V7h4v4M13 11V4h4v7M2 20h20M8 15h2M14 15h2" /></svg>
        Front Row
      </span>
      <span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8c3.2-3 6.2 3 9.2 0S18.1 5 21 8M3 13c3.2-3 6.2 3 9.2 0s5.9-3 8.8 0M3 18c3.2-3 6.2 3 9.2 0s5.9-3 8.8 0" /></svg>
        Pool View
      </span>
    </div>
    <button id="mobileBookButton" class="mobile-book-button" type="button">Book now</button>
  </section>

  <!-- Bootstrap modal stays at the top level for reliable fixed positioning. -->
  <div class="modal fade booking-modal" id="bookingModal" tabindex="-1" aria-labelledby="booking-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable booking-modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <p class="eyebrow mb-2" id="selected-cabana-label"></p>
            <h2 class="modal-title" id="booking-title">Book a cabana</h2>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p id="selected-cabana" class="selected-cabana">Check the guest details before confirming.</p>
          <form id="booking-form" class="row g-3">
            <div class="col-12">
              <label class="form-label" for="room">Room number</label>
              <input class="form-control form-control-lg" id="room" name="room" inputmode="numeric" autocomplete="off" placeholder="For example, 101" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="guest-name">Guest full name</label>
              <input class="form-control form-control-lg" id="guest-name" name="guestName" autocomplete="name" placeholder="For example, Alice Smith" required>
            </div>
            <div class="col-12 d-flex justify-content-end gap-3 align-items-center mt-4">
              <button class="btn btn-primary btn-lg booking-submit" type="submit">Confirm booking</button>
            </div>
          </form>
          <div id="form-error" class="alert alert-danger mt-4 mb-0" role="alert" hidden></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="/road.js"></script>
  <script src="/app.js"></script>
</body>
</html>
